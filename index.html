<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Node.js App</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #d3d3d3;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
    }
    h1 { color: #ff9900; margin-top: 0; }
    button {
      background: #232f3e;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #37475a; }
    #time { margin-top: 1rem; color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Node.js 👋</h1>
    <p>My first app, stored in AWS CodeCommit.</p>
    <button onclick="getTime()">Ask the server for the time</button>
    <p id="time"></p>
  </div>

  <script>
    async function getTime() {
      const res = await fetch('/api/time');
      const data = await res.json();
      document.getElementById('time').textContent = 'Server time: ' + data.time;
    }
  </script>
</body>
</html>
